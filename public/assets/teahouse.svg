<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1120" role="img" aria-labelledby="title desc">
  <title id="title">고양이 찻집의 사라진 초대장</title>
  <desc id="desc">비 오는 밤 찻집, 우산꽂이, 게시판, 고양이 단서가 있는 입문 추리 게임 이미지</desc>
  <defs>
