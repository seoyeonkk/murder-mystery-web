<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1120" role="img" aria-labelledby="title desc">
  <title id="title">검은 유리 온실 사건 현장</title>
  <desc id="desc">폭풍 속 유리 온실, 증거 핀, 검은 유리 테이블이 있는 머더미스터리 장면</desc>
  <defs>
    <linearGradient id="night" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0a110d"/>
      <stop offset="0.48" stop-color="#243323"/>
      <stop offset="1" stop-color="#15100d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#b7c5a0" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#f3ead8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#8c2b24" stop-opacity=".18"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .18"/>
      </feComponentTransfer>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="960" height="1120" fill="url(#night)"/>
  <rect width="960" height="1120" filter="url(#grain)" opacity=".55"/>
